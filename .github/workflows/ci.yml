# Every push to main publishes ghcr.io/chriscorbell/visor:latest and
# :sha-<commit>. Watchtower on the server picks it up, and open pages reload
# into the new build on their own.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: visor:ci
          build-args: BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The page and the health check must answer, with no hub to talk to.
      - name: Smoke test
        run: |
          docker run -d --name visor -p 3150:3150 -e HUB_URL=http://127.0.0.1:9 visor:ci
          for i in $(seq 20); do curl -fs -o /dev/null http://127.0.0.1:3150/api/health && break; sleep 0.5; done
          curl -fs http://127.0.0.1:3150/ | grep -q '<div id="root">'
          curl -fs -o /dev/null http://127.0.0.1:3150/manifest.webmanifest
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3150/api/feed)" = 404
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/chriscorbell/visor:latest
            ghcr.io/chriscorbell/visor:sha-${{ github.sha }}
          build-args: BUILD=${{ github.sha }}
          cache-from: type=gha
